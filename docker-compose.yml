version: "3.8"

services:
  fake-news-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fake-news-detector-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
